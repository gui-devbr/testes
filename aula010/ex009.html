<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De qual pais voce e?</title>
</head>
<body>
    <h1>Sistema de Paises</h1>
    <input type="text" name="txtpais1" id="txtpais1">
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res"></div>
    <script>
        function calcular(){
var res =document.getElementById('res')
var text = document.querySelector("input#txtpais1")
var pais = text.value.toLowerCase()

if (pais=="brasil"){
    res.innerText="Voce e Brasileiro 🙉"
}
else {
    res.innerText="Voce e estrangeiro 🤓"
}
}









    </script>

</body>
</html>
