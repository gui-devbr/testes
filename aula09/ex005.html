<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com o DOM</title>
    <style>
body {background-color: rgba(6, 112, 233, 0.445);} 
 

 h1:hover {color:rgb(3, 219, 165);

transform: translate(2px, 0px);}

    </style>
</head>
<body>
    <h1 Id="titulo">iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p> descobrindo novas tags</p>
    <div id="clique">
      <strong> clique em mim </strong> 
      
    </div>

    <script>
var p1 = document.getElementsByTagName('p')[1]

document.write(`aqui vai o resultado: ${p1.innerHTML}`)

var corpo = window.document.body

corpo.style.background = "skyblue"

var texto = window.document.getElementsByTagName('h1')[0]

texto.style.textAlign = 'center'

texto.style.color = 'rgb(255, 219, 165, 50)'

var titulo = window.document.getElementById('titulo')

titulo.style.background = 'blue'
titulo.innerText= 'Ola!'


window.document.getElementById('titulo').innerText = 'Ola!'

//window.document.getElementsByTagName('titulo')[0]

//titulo.style.color = "blue"

var d = window.document.querySelector('div#clique')
d.style.color = 'blue'


    </script>
</body>
</html>
